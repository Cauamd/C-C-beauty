
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>C&C Beauty — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site">
    <header class="header">
      <a class="brand" href="home.html">
        <div class="logo">C&C</div>
        <div><div style="font-weight:800">C&amp;C Beauty</div><div style="font-size:12px;color:var(--muted)">Acesse sua conta</div></div>
      </a>
      <nav class="nav" aria-label="Menu principal">
        <a href="home.html">Home</a>
        <a href="agendamento.html">Agendar</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Entrar</a>
      </nav>
    </header>

    <main class="card">
      <h1 class="h1">Entrar</h1>
      <p class="lead">Informe seu e‑mail e senha para acessar.</p>

      <form>
        <label for="email">E‑mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha" style="margin-top:8px">Senha</label>
        <input type="password" id="senha" name="senha" required>

        <button class="btn" type="submit" style="margin-top:12px">Entrar</button>
      </form>

      <p style="margin-top:10px;color:var(--muted);font-size:13px">Ainda não tem conta? <a href="cadastro.html">Cadastre‑se</a></p>
    </main>
  </div>

  <canvas id="hairCanvas"></canvas>
  <script src="index.js"></script>
</body>
</html>
