<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="login" class="page">
        <div class="auth-container">
            <h2 class="section-title">Bem-vinda/o de volta</h2>
            <form id="form-login" class="luxury-form">
                <input type="email" id="login-email" placeholder="E-mail" required>
                <input type="password" id="login-password" placeholder="Senha" required>
               <button type="submit" class="btn-primary"><a href="index.html">Entrar</a></button>
                <p class="auth-switch">Não tem conta? <a href="cadastro.html" onclick="navigateTo('register')">Cadastre-se aqui</a></p>
            </form>
        </div>
    </section>

</body>
</html>
